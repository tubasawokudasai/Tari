<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Dialog Window Gradient -->
    <linearGradient id="dialog-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow-2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bg-grad-2)"/>

  <!-- Ambient Glow Behind Dialog Window -->
  <circle cx="450" cy="240" r="240" fill="#3b82f6" opacity="0.12" filter="url(#glow-2)"/>
  <circle cx="650" cy="300" r="180" fill="#8b5cf6" opacity="0.1" filter="url(#glow-2)"/>

  <!-- Tari Floating Preview Dialog -->
  <g transform="translate(100, 30)" filter="url(#shadow-2)">
    <!-- Window Container -->
    <rect width="700" height="420" rx="14" fill="url(#dialog-grad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M0 14a14 14 0 0114-14h672a14 14 0 0114 14v36H0V14z" fill="#0f172a"/>
    <line x1="0" y1="50" x2="700" y2="50" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Window Control Buttons (Red, Yellow, Green) -->
    <circle cx="24" cy="25" r="6" fill="#ef4444"/>
    <circle cx="42" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="6" fill="#10b981"/>

    <!-- Address Bar Pill -->
    <rect x="180" y="12" width="340" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <!-- Lock Icon -->
    <path d="M200 22v-3a3 3 0 016 0v3m-7 0h8a1 1 0 011 1v5a1 1 0 01-1 1h-8a1 1 0 01-1-1v-5a1 1 0 011-1z" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="216" y="29" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">https://developer.apple.com/swiftui/</text>

    <!-- Header Action Button (Open External Browser) -->
    <rect x="636" y="14" width="50" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="661" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">打开 ↗</text>

    <!-- Embedded Web Page Body Simulation (WebKit Preview Area) -->
    <g transform="translate(0, 51)">
      <!-- Webpage background -->
      <rect width="700" height="324" fill="#090d16"/>

      <!-- Web Banner Hero Area -->
      <rect x="0" y="0" width="700" height="150" fill="url(#bg-grad-2)"/>
      <circle cx="580" cy="70" r="100" fill="#2563eb" opacity="0.25" filter="url(#glow-2)"/>
      
      <!-- Apple Logo / Header Title -->
      <text x="40" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">SwiftUI Overview</text>
      <text x="40" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Build better apps across all Apple platforms with less code.</text>
      
      <!-- Call to Action Button in Web Preview -->
      <rect x="40" y="94" width="130" height="32" rx="16" fill="#2563eb"/>
      <text x="105" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Documentation</text>

      <!-- Web Content Grid Columns -->
      <g transform="translate(40, 175)">
        <!-- Col 1 -->
        <rect x="0" y="0" width="190" height="125" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)"/>
        <rect x="16" y="18" width="120" height="10" rx="3" fill="#60a5fa"/>
        <rect x="16" y="38" width="158" height="6" rx="2" fill="#475569"/>
        <rect x="16" y="50" width="140" height="6" rx="2" fill="#475569"/>
        <rect x="16" y="62" width="110" height="6" rx="2" fill="#475569"/>
        <rect x="16" y="86" width="70" height="20" rx="4" fill="rgba(59, 130, 246, 0.2)"/>

        <!-- Col 2 -->
        <rect x="215" y="0" width="190" height="125" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)"/>
        <rect x="231" y="18" width="120" height="10" rx="3" fill="#a78bfa"/>
        <rect x="231" y="38" width="158" height="6" rx="2" fill="#475569"/>
        <rect x="231" y="50" width="140" height="6" rx="2" fill="#475569"/>
        <rect x="231" y="62" width="110" height="6" rx="2" fill="#475569"/>
        <rect x="231" y="86" width="70" height="20" rx="4" fill="rgba(167, 139, 250, 0.2)"/>

        <!-- Col 3 -->
        <rect x="430" y="0" width="190" height="125" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.05)"/>
        <rect x="446" y="18" width="120" height="10" rx="3" fill="#34d399"/>
        <rect x="446" y="38" width="158" height="6" rx="2" fill="#475569"/>
        <rect x="446" y="50" width="140" height="6" rx="2" fill="#475569"/>
        <rect x="446" y="62" width="110" height="6" rx="2" fill="#475569"/>
        <rect x="446" y="86" width="70" height="20" rx="4" fill="rgba(52, 211, 153, 0.2)"/>
      </g>
    </g>

    <!-- Dialog Footer Bar -->
    <g transform="translate(0, 375)">
      <rect width="700" height="45" rx="0" fill="#0f172a"/>
      <line x1="0" y1="0" x2="700" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="20" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">按 ESC 键或点击窗口外部即可关闭</text>

      <rect x="580" y="8" width="104" height="28" rx="6" fill="#4f46e5"/>
      <text x="632" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">复制并粘贴</text>
    </g>

  </g>
</svg>
