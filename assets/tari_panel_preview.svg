<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glassmorphism Panel Gradient -->
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
    
    <linearGradient id="card-active-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.15)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Glow Behind Panel -->
  <circle cx="450" cy="360" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="380" r="150" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="700" cy="380" r="150" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- Top macOS Status Bar Simulation -->
  <rect width="900" height="32" fill="rgba(0,0,0,0.3)" />
  <g transform="translate(730, 8)" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    <!-- Wi-Fi -->
    <path d="M12 3a8.97 8.97 0 00-6.36 2.64.75.75 0 001.06 1.06A7.47 7.47 0 0112 4.5c2.07 0 3.94.84 5.3 2.2a.75.75 0 001.06-1.06A8.97 8.97 0 0012 3z" fill="#cbd5e1"/>
    <circle cx="12" cy="12" r="1.5" fill="#cbd5e1"/>
    <!-- Status Bar Icon (Tari) -->
    <g transform="translate(-45, -2)">
      <rect x="0" y="0" width="22" height="18" rx="4" fill="#6366f1" />
      <path d="M6 5h10M6 9h7M6 13h9" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Time -->
    <text x="35" y="12" fill="#e2e8f0" font-weight="600">09:41 AM</text>
  </g>

  <!-- Tari Panel Window (Bottom Docked Overlay) -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <!-- Main Window Frame -->
    <rect width="840" height="330" rx="16" fill="url(#panel-grad)" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>

    <!-- Search Bar & Controls Header -->
    <g transform="translate(20, 16)">
      <!-- Search Input Box -->
      <rect width="360" height="34" rx="8" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <path d="M14 10a5 5 0 100 10 5 5 0 000-10zm-7 5a7 7 0 1112.02 4.95l3.26 3.26a1 1 0 01-1.42 1.42l-3.26-3.26A7 7 0 017 15z" fill="#94a3b8"/>
      <text x="38" y="21" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13">搜索剪贴板历史记录...</text>

      <!-- Category Filter Pills -->
      <g transform="translate(380, 2)">
        <!-- Pill: All (Active) -->
        <rect x="0" y="0" width="54" height="30" rx="6" fill="#6366f1"/>
        <text x="27" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">全部</text>

        <!-- Pill: Text -->
        <rect x="62" y="0" width="54" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
        <text x="89" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">文本</text>

        <!-- Pill: Link -->
        <rect x="124" y="0" width="54" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
        <text x="151" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">链接</text>

        <!-- Pill: Image -->
        <rect x="186" y="0" width="54" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
        <text x="213" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">图片</text>

        <!-- Pill: File -->
        <rect x="248" y="0" width="54" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
        <text x="275" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">文件</text>

        <!-- Pill: Code -->
        <rect x="310" y="0" width="54" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
        <text x="337" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">代码</text>
      </g>
    </g>

    <!-- Clipboard Horizontal Items Grid -->
    <g transform="translate(20, 68)">
      
      <!-- CARD 1: Web Link (Active Selected) -->
      <g transform="translate(0, 0)">
        <rect width="250" height="236" rx="12" fill="url(#card-active-grad)" stroke="#818cf8" stroke-width="1.8"/>
        <!-- App Header Badge -->
        <rect x="12" y="12" width="28" height="28" rx="6" fill="#1d4ed8"/>
        <!-- Safari Icon representation -->
        <circle cx="26" cy="26" r="8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
        <polygon points="26,20 28,26 26,32 24,26" fill="#60a5fa"/>
        <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Safari</text>
        <text x="48" y="37" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">刚刚</text>

        <!-- Type Tag -->
        <rect x="186" y="12" width="52" height="20" rx="4" fill="rgba(59, 130, 246, 0.25)"/>
        <text x="212" y="26" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">链接</text>

        <!-- Content Snippet -->
        <text x="14" y="70" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">https://developer.apple.com</text>
        <text x="14" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Apple Developer Documentation &amp; WWDC Highlights...</text>

        <!-- Web Preview Mini-Thumbnail -->
        <rect x="14" y="112" width="222" height="110" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.1)"/>
        <rect x="24" y="124" width="120" height="12" rx="3" fill="#3b82f6"/>
        <rect x="24" y="144" width="180" height="8" rx="2" fill="#334155"/>
        <rect x="24" y="158" width="150" height="8" rx="2" fill="#334155"/>
        <rect x="24" y="176" width="60" height="24" rx="4" fill="#2563eb"/>
      </g>

      <!-- CARD 2: Code Snippet -->
      <g transform="translate(265, 0)">
        <rect width="250" height="236" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <rect x="12" y="12" width="28" height="28" rx="6" fill="#0284c7"/>
        <!-- Xcode Icon representation -->
        <path d="M20 18l4 8 8-12-6 10-6-6z" fill="#ffffff"/>
        <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Xcode</text>
        <text x="48" y="37" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">2分钟前</text>

        <!-- Type Tag -->
        <rect x="186" y="12" width="52" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="212" y="26" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">代码</text>

        <!-- Code Content Block -->
        <rect x="14" y="54" width="222" height="168" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.05)"/>
        <g font-family="'SF Mono', Menlo, Monaco, monospace" font-size="11" fill="#e2e8f0">
          <text x="24" y="76"><tspan fill="#f43f5e">func</tspan> <tspan fill="#60a5fa">checkClipboard</tspan>() {</text>
          <text x="36" y="96"><tspan fill="#f43f5e">let</tspan> count = pb.changeCount</text>
          <text x="36" y="116"><tspan fill="#f43f5e">guard</tspan> count != lastCount</text>
          <text x="36" y="136"><tspan fill="#f43f5e">else</tspan> { <tspan fill="#f43f5e">return</tspan> }</text>
          <text x="36" y="156">self.processData()</text>
          <text x="24" y="176">}</text>
        </g>
      </g>

      <!-- CARD 3: Image Item -->
      <g transform="translate(530, 0)">
        <rect width="270" height="236" rx="12" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
        <rect x="12" y="12" width="28" height="28" rx="6" fill="#7c3aed"/>
        <!-- Photos Icon -->
        <circle cx="26" cy="26" r="7" fill="#f472b6"/>
        <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Photos</text>
        <text x="48" y="37" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">8分钟前</text>

        <!-- Type Tag -->
        <rect x="206" y="12" width="52" height="20" rx="4" fill="rgba(168, 85, 247, 0.2)"/>
        <text x="232" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">图片</text>

        <!-- Image Canvas Graphic -->
        <rect x="14" y="54" width="242" height="140" rx="8" fill="#1e1b4b"/>
        <!-- Mountain Landscape vector drawing -->
        <path d="M14 160l50-50 40 30 60-60 78 80H14z" fill="#4c1d95"/>
        <path d="M80 170l40-40 30 20 52-50 40 70H80z" fill="#6d28d9"/>
        <circle cx="200" cy="90" r="14" fill="#fbbf24" opacity="0.8"/>

        <!-- Image Info Footer -->
        <text x="14" y="214" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">PNG Image • 1920 × 1080 • 2.4 MB</text>
      </g>

    </g>
  </g>
</svg>
